App\Entity\Localization:
    constraints:
        - Symfony\Bridge\Doctrine\Validator\Constraints\UniqueEntity:
              fields: [name, countryCode]
              message: 'Taka lokalizacja już istnieje.'
              groups: [create]
    properties:
        name:
            - NotBlank:
                  groups: [create, edit]
            - Length:
                  min: 2
                  max: 255
                  groups: [create, edit]
        countryCode:
            - NotBlank:
                  groups: [create]
        latitude:
            - Range:
                  min: -90
                  max: 90
                  groups: [create, edit]
        longitude:
            - Range:
                  min: -180
                  max: 180
                  groups: [create, edit]
